<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYPTO PRICE TRACKER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- HEADER -->
     <header>
        <div class="logo">
            <img src="logo.png" alt="CT-logo">
            <h1>CRYPTO PRICE TRACKER</h1>
        </div>

        <div class="search-box">
            <i>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </i>
            <input type="text" id="searchInput" placeholder="Search cryptocurrency...">
        </div>
     </header>
    
     <!-- STATUS -->
      <section class="status-bar">
        <div class="loading" id="loadingIndicator">
            <i class="spinner" aria-hidden="true"></i>
            <span>Loading cryptocurrency data...</span>
        </div>

        <div class="update">
            <span class="dot"></span>
            Last Updated: <span id="lastUpdated">—</span>
            <span class="countdown" id="refreshCountdown"></span>
        </div>
      </section>

      <!-- ERROR MESSAGE (hidden unless a fetch/API error occurs) -->
      <div class="error-banner" id="errorBanner" role="alert" hidden>
        <span id="errorMessage"></span>
        <button type="button" id="errorRetryBtn">Retry</button>
      </div>

      <!-- MAIN-CONTENT -->
       <main>
        <section class="market-section">
           <div class="market-header">
             <h2>MARKET OVERVIEW</h2>
             <div class="market-controls">
                <span id="resultsCount" class="results-count"></span>
                <label for="sortSelect">Sort by</label>
                <select id="sortSelect">
                    <option value="market_cap_desc">Highest Market Cap</option>
                    <option value="price_desc">Highest Price</option>
                    <option value="price_asc">Lowest Price</option>
                    <option value="change_desc">Best 24h Gain</option>
                    <option value="change_asc">Worst 24h Loss</option>
                </select>
             </div>
           </div>
           <table>

            <thead>

             <tr>
                <th>#</th>
                <th>Coin</th>
                <th>Symbol</th>
                <th>Price(USD)</th>
                <th>24h Change</th>
                <th>7-day Sparkline</th>
                <th>Watchlist</th>
             </tr>
            </thead>
            <tbody id="coinsTableBody">
                <!-- JAVASCRIPT WILL INSERT COIN ROWS HERE -->
            </tbody>
           </table>
        </section>

        <!-- WATCHLIST -->
         <aside class="watchlist">
            <h2>WATCHLIST</h2>
            <div class="watchlist-container" id="watchlistContainer">
            <!-- WATCHLIST ITEMS WILL BE DISPLAYED HERE -->
            </div>

            <button class="clear-watchlist" id="clearWatchlistBtn">
                <i>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                        <path d="M10 11v6"></path>
                        <path d="M14 11v6"></path>
                        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
                    </svg>
                </i>
                Clear Watchlist
            </button>
         </aside>
       </main>

       <!-- FOOTER -->
        <footer>
            <p>&copy;2026 CRYTO PRICE TRACKER. All rights reserved.</p>
        </footer>
        </div>
<script src="crypto.js" defer></script>

</body>
</html>
